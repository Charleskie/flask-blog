{% extends "base.html" %}

{% block title %}设置 - 我的个人网站{% endblock %}

{% block content %}
<div class="container-xl width-full py-8 settings-index">
    <header class="mb-4">
        <h2 class="f3 text-bold mb-2 color-fg-default">设置</h2>
        <p class="f5 color-fg-muted m-0">管理您的账户信息和隐私设置</p>
    </header>

    <div class="Box mb-4">
        <a href="{{ url_for('auth.profile') }}" class="Box-row d-flex items-center justify-between gap-3 settings-category-row">
            <div class="d-flex items-center gap-3 flex-auto min-width-0">
                <div class="d-flex items-center justify-center flex-shrink-0 rounded-full settings-icon-circle settings-icon-circle--accent" aria-hidden="true">
                    <i class="fas fa-user f5 color-fg-accent"></i>
                </div>
                <div class="d-flex flex-column gap-1 min-width-0">
                    <span class="f5 text-bold color-fg-default">个人资料</span>
                    <span class="f6 color-fg-muted">查看当前资料页并进入完整编辑</span>
                </div>
            </div>
            <i class="fas fa-chevron-right f5 color-fg-muted flex-shrink-0" aria-hidden="true"></i>
        </a>
        <a href="{{ url_for('auth.edit_profile') }}" class="Box-row d-flex items-center justify-between gap-3 settings-category-row">
            <div class="d-flex items-center gap-3 flex-auto min-width-0">
                <div class="d-flex items-center justify-center flex-shrink-0 rounded-full settings-icon-circle settings-icon-circle--success" aria-hidden="true">
                    <i class="fas fa-shield-alt f5 color-fg-success"></i>
                </div>
                <div class="d-flex flex-column gap-1 min-width-0">
                    <span class="f5 text-bold color-fg-default">编辑资料</span>
                    <span class="f6 color-fg-muted">修改头像、邮箱、密码和个人信息</span>
                </div>
            </div>
            <i class="fas fa-chevron-right f5 color-fg-muted flex-shrink-0" aria-hidden="true"></i>
        </a>
        <a href="{{ url_for('auth.edit_profile') }}" class="Box-row d-flex items-center justify-between gap-3 settings-category-row">
            <div class="d-flex items-center gap-3 flex-auto min-width-0">
                <div class="d-flex items-center justify-center flex-shrink-0 rounded-full settings-icon-circle settings-icon-circle--attention" aria-hidden="true">
                    <i class="fas fa-eye-slash f5 color-fg-attention"></i>
                </div>
                <div class="d-flex flex-column gap-1 min-width-0">
                    <span class="f5 text-bold color-fg-default">资料展示</span>
                    <span class="f6 color-fg-muted">控制资料公开范围与信息显示</span>
                </div>
            </div>
            <i class="fas fa-chevron-right f5 color-fg-muted flex-shrink-0" aria-hidden="true"></i>
        </a>
    </div>

    <section class="mt-4">
        <h3 class="f4 text-bold mb-3 color-fg-default">快速操作</h3>
        <div class="d-flex flex-wrap gap-3">
            <a href="{{ url_for('auth.edit_profile', section='password') }}#password" class="Box btn btn-primary btn-sm p-3 d-flex items-center gap-3 flex-1 width-full settings-quick-card settings-quick-card--primary settings-quick-card-min">
                <div class="d-flex items-center justify-center flex-shrink-0 rounded-full settings-icon-circle settings-icon-circle--on-primary" aria-hidden="true">
                    <i class="fas fa-key f5 settings-icon-on-primary"></i>
                </div>
                <div class="d-flex flex-column gap-1 min-width-0">
                    <span class="f6 text-bold settings-text-on-primary">修改密码</span>
                    <span class="f6 settings-text-on-primary-muted">更新账户密码</span>
                </div>
            </a>
            <a href="{{ url_for('settings.privacy_settings') }}" class="Box btn btn-outline btn-sm p-3 d-flex items-center gap-3 flex-1 width-full settings-quick-card settings-quick-card-min">
                <div class="d-flex items-center justify-center flex-shrink-0 rounded-full settings-icon-circle settings-icon-circle--attention" aria-hidden="true">
                    <i class="fas fa-eye-slash f5 color-fg-attention"></i>
                </div>
                <div class="d-flex flex-column gap-1 min-width-0">
                    <span class="f6 text-bold color-fg-default">资料展示</span>
                    <span class="f6 color-fg-muted">管理资料公开范围</span>
                </div>
            </a>
        </div>
    </section>
</div>

<style>
.settings-index .settings-category-row {
    text-decoration: none;
    color: var(--fgColor-default);
    transition: background-color 0.15s ease;
}
.settings-index .settings-category-row:hover {
    text-decoration: none;
    color: var(--fgColor-default);
}
.settings-icon-circle {
    width: 32px;
    height: 32px;
}
.settings-icon-circle--accent {
    background-color: var(--bgColor-accent-muted);
}
.settings-icon-circle--success {
    background-color: var(--bgColor-success-muted);
}
.settings-icon-circle--danger {
    background-color: var(--bgColor-danger-muted);
}
.settings-icon-circle--attention {
    background-color: var(--bgColor-attention-muted);
}
.settings-quick-card {
    text-decoration: none;
    color: var(--fgColor-default);
    box-shadow: var(--shadow-resting-small);
    justify-content: flex-start;
    text-align: left;
    white-space: normal;
    height: auto;
    min-height: unset;
    line-height: 1.4;
    transition: background-color 0.15s ease, border-color 0.15s ease;
}
.settings-quick-card:not(.settings-quick-card--primary) {
    background-color: var(--bgColor-default);
}
.settings-quick-card:not(.settings-quick-card--primary):hover {
    text-decoration: none;
    color: var(--fgColor-default);
    background-color: var(--bgColor-muted);
    border-color: var(--borderColor-default);
}
.settings-quick-card--primary {
    background-color: var(--button-primary-bgColor-rest);
    border-color: var(--button-primary-bgColor-rest);
    color: var(--fgColor-onEmphasis);
}
.min-width-0 {
    min-width: 0;
}
.settings-quick-card-min {
    min-width: 200px;
}
.settings-quick-card--primary:hover {
    color: var(--fgColor-onEmphasis);
    background-color: var(--button-primary-bgColor-hover);
    border-color: var(--button-primary-bgColor-hover);
}
.settings-icon-circle--on-primary {
    background-color: color-mix(in srgb, var(--fgColor-onEmphasis) 22%, transparent);
}
.settings-text-on-primary,
.settings-icon-on-primary {
    color: var(--fgColor-onEmphasis);
}
.settings-text-on-primary-muted {
    color: color-mix(in srgb, var(--fgColor-onEmphasis) 82%, transparent);
}
</style>
{% endblock %}
