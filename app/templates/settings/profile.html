{% extends "base.html" %}

{% block title %}个人信息设置 - 我的个人网站{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.css">

<script>
document.addEventListener('DOMContentLoaded', function() {
    const avatarInput = document.getElementById('avatar-input');
    const currentAvatar = document.getElementById('current-avatar');
    const avatarPreview = document.getElementById('avatar-preview');
    const uploadBtn = document.getElementById('upload-avatar-btn');
    const cancelBtn = document.getElementById('cancel-avatar');
    const previewContainer = document.querySelector('.avatar-preview-container');
    const actionsContainer = document.querySelector('.avatar-actions');
    const avatarContainer = document.querySelector('.avatar-container');
    let cropper = null;

    avatarContainer.addEventListener('click', function() {
        avatarInput.click();
    });

    uploadBtn.addEventListener('click', function() {
        avatarInput.click();
    });

    function compressImage(file, maxWidth = 800, maxHeight = 800, quality = 0.8) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    let { width, height } = img;

                    if (width > maxWidth || height > maxHeight) {
                        const ratio = Math.min(maxWidth / width, maxHeight / height);
                        width *= ratio;
                        height *= ratio;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    canvas.toBlob(function(blob) {
                        resolve(blob);
                    }, file.type, quality);
                };
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    avatarInput.addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (file) {
            if (!file.type.startsWith('image/')) {
                alert('请选择图片文件！');
                return;
            }

            if (file.size > 5 * 1024 * 1024) {
                alert('文件大小不能超过5MB！');
                return;
            }

            try {
                const compressedBlob = await compressImage(file, 800, 800, 0.8);
                const compressedFile = new File([compressedBlob], file.name, { type: file.type });
                showCropModal(compressedFile);
            } catch (error) {
                console.error('图片压缩失败:', error);
                alert('图片处理失败，请重试！');
            }
        }
    });

    function showCropModal(file) {
        const modalHtml = `
            <div id="cropModal" style="position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0,0,0,0.5);">
                <div class="Box" style="max-width: 720px; width: 100%; max-height: 90vh; overflow: auto;">
                    <div class="Box-header d-flex justify-between items-center">
                        <span class="f5 text-bold color-fg-default">裁剪头像</span>
                        <button type="button" class="btn btn-sm btn-outline" onclick="closeCropModal()" aria-label="关闭">&times;</button>
                    </div>
                    <div class="Box-body text-center">
                        <img id="crop-image" class="width-full" style="max-height: 60vh; display: block; margin: 0 auto;">
                    </div>
                    <div class="Box-footer d-flex justify-end gap-2">
                        <button type="button" class="btn btn-secondary" onclick="closeCropModal()">取消</button>
                        <button type="button" class="btn btn-primary" onclick="confirmCrop()">确认裁剪</button>
                    </div>
                </div>
            </div>
        `;

        const existingModal = document.getElementById('cropModal');
        if (existingModal) {
            existingModal.remove();
        }

        document.body.insertAdjacentHTML('beforeend', modalHtml);

        const cropImage = document.getElementById('crop-image');
        const reader = new FileReader();
        reader.onload = function(e) {
            cropImage.src = e.target.result;
            cropper = new Cropper(cropImage, {
                aspectRatio: 1,
                viewMode: 1,
                autoCropArea: 0.8,
                movable: true,
                zoomable: true,
                rotatable: true,
                scalable: true,
                guides: true,
                center: true,
                highlight: true,
                background: true,
                cropBoxResizable: true,
                cropBoxMovable: true,
                minCropBoxWidth: 100,
                minCropBoxHeight: 100
            });
        };
        reader.readAsDataURL(file);

        window.currentCropFile = file;
    }

    window.closeCropModal = function() {
        const modal = document.getElementById('cropModal');
        if (modal) {
            modal.remove();
        }
        if (cropper) {
            cropper.destroy();
            cropper = null;
        }
        window.currentCropFile = null;
    };

    window.confirmCrop = function() {
        if (!cropper) return;

        cropper.getCroppedCanvas({
            width: 300,
            height: 300
        }).toBlob(function(blob) {
            const croppedFile = new File([blob], window.currentCropFile.name, {
                type: window.currentCropFile.type
            });

            closeCropModal();

            const reader = new FileReader();
            reader.onload = function(e) {
                avatarPreview.src = e.target.result;
                previewContainer.classList.remove('d-none');
                actionsContainer.classList.remove('d-none');
                uploadBtn.classList.add('d-none');
                currentAvatar.style.opacity = '0.5';
            };
            reader.readAsDataURL(blob);

            const dataTransfer = new DataTransfer();
            dataTransfer.items.add(croppedFile);
            avatarInput.files = dataTransfer.files;

        }, window.currentCropFile.type, 0.9);
    };

    cancelBtn.addEventListener('click', function() {
        avatarInput.value = '';
        previewContainer.classList.add('d-none');
        actionsContainer.classList.add('d-none');
        uploadBtn.classList.remove('d-none');
        currentAvatar.style.opacity = '1';
    });

    avatarContainer.addEventListener('dragover', function(e) {
        e.preventDefault();
        avatarContainer.style.border = '2px dashed var(--fgColor-accent)';
    });

    avatarContainer.addEventListener('dragleave', function(e) {
        e.preventDefault();
        avatarContainer.style.border = '';
    });

    avatarContainer.addEventListener('drop', function(e) {
        e.preventDefault();
        avatarContainer.style.border = '';
        const files = e.dataTransfer.files;
        if (files.length > 0) {
            avatarInput.files = files;
            const event = new Event('change', { bubbles: true });
            avatarInput.dispatchEvent(event);
        }
    });
});
</script>

<style>
.avatar-container { position: relative; display: inline-block; cursor: pointer; }
.avatar-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.4);
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.15s ease;
    color: white;
}
.avatar-container:hover .avatar-overlay { opacity: 1; }
.avatar-preview-container {
    border: 2px solid var(--borderColor-default);
    border-radius: 50%;
    padding: 4px;
    display: inline-block;
}
.avatar-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
}
.settings-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 767px) { .settings-form-grid { grid-template-columns: 1fr; } }
</style>
{% endblock %}

{% block content %}
<div class="container-xl py-4">
    <a href="{{ url_for('settings.settings') }}" class="d-flex items-center gap-2 mb-3 color-fg-default no-underline">
        <i class="fas fa-arrow-left" aria-hidden="true"></i>
        <span>返回设置</span>
    </a>

    <h2 class="f3 text-bold color-fg-default mb-2">个人信息设置</h2>
    <p class="f5 color-fg-muted mb-4">管理您的个人资料和头像</p>

    <form method="POST" enctype="multipart/form-data">
        <div class="Box mb-4">
            <div class="Box-header">
                <h3 class="f5 text-bold m-0 color-fg-default">头像设置</h3>
            </div>
            <div class="Box-body text-center">
                <div class="avatar-container mb-3">
                    <img src="{{ current_user.get_avatar_url() }}"
                         alt="头像"
                         id="current-avatar"
                         width="120"
                         height="120"
                         style="width: 120px; height: 120px; object-fit: cover; border-radius: 50%; border: 2px solid var(--borderColor-default); display: block;">
                    <div class="avatar-overlay">
                        <i class="fas fa-camera mb-1" aria-hidden="true"></i>
                        <span class="f6">点击更换</span>
                    </div>
                </div>

                <input type="file"
                       class="d-none"
                       id="avatar-input"
                       name="avatar"
                       accept="image/*">

                <div class="avatar-preview-container d-none mb-3">
                    <img id="avatar-preview" alt="" width="120" height="120"
                         style="width: 120px; height: 120px; object-fit: cover; border-radius: 50%; border: 2px solid var(--borderColor-default); display: block;">
                </div>

                <div class="avatar-actions d-none mb-3">
                    <button type="button" id="cancel-avatar" class="btn btn-secondary btn-sm">
                        <i class="fas fa-times" aria-hidden="true"></i> 取消
                    </button>
                    <button type="submit"
                            class="btn btn-primary btn-sm"
                            formaction="{{ url_for('settings.upload_avatar') }}">
                        <i class="fas fa-upload" aria-hidden="true"></i> 确认上传
                    </button>
                </div>

                <button type="button" id="upload-avatar-btn" class="btn btn-outline btn-sm">
                    <i class="fas fa-upload" aria-hidden="true"></i> 上传头像
                </button>
            </div>
        </div>

        <div class="Box mb-4">
            <div class="Box-header">
                <h3 class="f5 text-bold m-0 color-fg-default">基本信息</h3>
            </div>
            <div class="Box-body">
                <div class="settings-form-grid">
                    <div>
                        <label for="nickname" class="form-label">昵称</label>
                        <input type="text" class="form-control" id="nickname" name="nickname"
                               value="{{ current_user.nickname or '' }}" placeholder="请输入昵称">
                    </div>
                    <div>
                        <label for="location" class="form-label">所在地</label>
                        <input type="text" class="form-control" id="location" name="location"
                               value="{{ current_user.location or '' }}" placeholder="请输入所在地">
                    </div>
                    <div>
                        <label for="company" class="form-label">公司</label>
                        <input type="text" class="form-control" id="company" name="company"
                               value="{{ current_user.company or '' }}" placeholder="请输入公司名称">
                    </div>
                    <div>
                        <label for="job_title" class="form-label">职位</label>
                        <input type="text" class="form-control" id="job_title" name="job_title"
                               value="{{ current_user.job_title or '' }}" placeholder="请输入职位">
                    </div>
                    <div>
                        <label for="website" class="form-label">个人网站</label>
                        <input type="url" class="form-control" id="website" name="website"
                               value="{{ current_user.website or '' }}" placeholder="https://example.com">
                    </div>
                    <div>
                        <label for="phone" class="form-label">电话</label>
                        <input type="tel" class="form-control" id="phone" name="phone"
                               value="{{ current_user.phone or '' }}" placeholder="请输入电话号码">
                    </div>
                </div>

                <div class="mt-3">
                    <label for="bio" class="form-label">个人简介</label>
                    <textarea class="form-control" id="bio" name="bio" rows="4"
                              placeholder="介绍一下自己...">{{ current_user.bio or '' }}</textarea>
                </div>
            </div>
        </div>

        <div class="d-flex justify-end border-top pt-3 mt-4">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save" aria-hidden="true"></i> 保存更改
            </button>
        </div>
    </form>
</div>
{% endblock %}
