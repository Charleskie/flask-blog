{% extends "base.html" %}

{% block title %}新增友链 - {{ super() }}{% endblock %}

{% block content %}
<div class="container-lg py-6">
    <div class="mb-4">
        <h1 class="f2 text-bold color-fg-default m-0 mb-2">新增友链</h1>
        <p class="f4 color-fg-muted m-0">手动添加新的友情链接</p>
    </div>

    <div class="Box">
        <div class="Box-body">
            <form method="POST" class="space-y-4">
                <div class="d-grid grid-cols-1 d-regular-grid grid-regular-cols-2 gap-3">
                    <div>
                        <label for="name" class="form-label">网站名称 *</label>
                        <input type="text" id="name" name="name" required
                               class="form-control width-full" placeholder="网站名称">
                    </div>
                    <div>
                        <label for="url" class="form-label">网站链接 *</label>
                        <input type="url" id="url" name="url" required
                               class="form-control width-full" placeholder="https://example.com">
                    </div>
                </div>

                <div>
                    <label for="description" class="form-label">网站描述</label>
                    <textarea id="description" name="description" rows="3"
                              class="form-control width-full" placeholder="简要描述"></textarea>
                </div>

                <div class="d-grid grid-cols-1 d-regular-grid grid-regular-cols-2 gap-3">
                    <div>
                        <label for="email" class="form-label">联系邮箱</label>
                        <input type="email" id="email" name="email"
                               class="form-control width-full" placeholder="contact@example.com">
                    </div>
                    <div>
                        <label for="status" class="form-label">状态</label>
                        <select id="status" name="status" class="form-select width-full">
                            <option value="active">活跃</option>
                            <option value="pending">待审核</option>
                            <option value="inactive">已拒绝</option>
                        </select>
                    </div>
                </div>

                <div class="d-grid grid-cols-1 d-regular-grid grid-regular-cols-2 gap-3">
                    <div>
                        <label for="sort_order" class="form-label">排序权重</label>
                        <input type="number" id="sort_order" name="sort_order" value="0"
                               class="form-control width-full" placeholder="0">
                        <p class="f6 color-fg-muted m-0 mt-1">数值越大排序越靠前</p>
                    </div>
                    <div class="d-flex items-center gap-2">
                        <input type="checkbox" id="featured" name="featured" value="1">
                        <label class="form-label m-0" for="featured">设为推荐友链</label>
                    </div>
                </div>

                <div class="d-flex flex-wrap justify-end gap-2 pt-3 border-top">
                    <a href="{{ url_for('admin.admin_links') }}" class="btn btn-secondary no-underline">取消</a>
                    <button type="submit" class="btn btn-primary">创建友链</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
