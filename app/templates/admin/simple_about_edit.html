{% extends "base.html" %}

{% block title %}关于页面编辑 - 管理后台{% endblock %}

{% block content %}
<div class="container-xl mx-auto px-3 py-4">
    <div class="d-flex flex-wrap items-center justify-between gap-3 mb-4">
        <h1 class="f3 text-bold color-fg-default m-0"><i class="fas fa-user-circle mr-2"></i>关于页面编辑</h1>
        <a href="{{ url_for('admin.admin_about') }}" class="btn btn-outline btn-sm">
            <i class="fas fa-arrow-left"></i> 返回管理
        </a>
    </div>

    <div class="Box">
        <div class="Box-body p-4">
            <form method="POST" id="about-form" class="d-flex flex-column gap-4">
                <div class="about-edit-layout">
                        <div class="d-flex flex-column gap-4">
                            <div class="d-flex flex-column gap-2">
                                <label for="page_title" class="form-label m-0">页面标题 *</label>
                                <input type="text" class="form-control" id="page_title" name="page_title"
                                       value="{{ page_title or '关于我' }}" required>
                                <p class="f6 color-fg-muted m-0">关于页面的主标题</p>
                            </div>
                            <div class="d-flex flex-column gap-2">
                                <label for="page_content" class="form-label m-0">页面内容 *</label>
                                <div id="tiptap-container"></div>
                                <textarea id="page_content" name="page_content" class="d-none" required>{{ page_content or '' }}</textarea>
                                <p class="f6 color-fg-muted m-0"><i class="fas fa-info-circle mr-1"></i>使用富文本编辑器，支持格式化文本、链接、图片等</p>
                            </div>
                        </div>
                        <div>
                            <div class="Box">
                                <div class="Box-header border-bottom f6 text-semibold">
                                    <i class="fas fa-eye mr-2"></i>内容预览
                                </div>
                                <div class="Box-body p-3">
                                    <div id="content-preview" class="about-preview overflow-y-auto f6 color-fg-default" style="min-height: 200px; max-height: 400px;">
                                        <p class="color-fg-muted m-0">输入内容后将在此处显示预览</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                </div>

                <div class="d-flex flex-wrap justify-end gap-2 border-top pt-4">
                    <a href="{{ url_for('admin.admin_about') }}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> 取消
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> 保存页面
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
.about-edit-layout {
    display: flex;
    flex-direction: column;
    gap: 24px;
}
@media (min-width: 1012px) {
    .about-edit-layout {
        display: grid;
        grid-template-columns: 2fr 1fr;
        align-items: start;
    }
}
.about-preview {
    border: 1px solid var(--borderColor-default);
    border-radius: var(--borderRadius-medium);
    padding: 16px;
    line-height: 1.6;
    background: var(--bgColor-muted);
}
.about-preview h1, .about-preview h2, .about-preview h3,
.about-preview h4, .about-preview h5, .about-preview h6 {
    color: var(--fgColor-default);
    margin: 0 0 12px;
}
.about-preview p { margin: 0 0 12px; }
.about-preview a { color: var(--fgColor-accent); text-decoration: none; }
.about-preview a:hover { text-decoration: underline; }
.about-preview ul, .about-preview ol { margin: 0 0 12px; padding-left: 20px; }
.about-preview blockquote {
    border-left: 4px solid var(--borderColor-accent-emphasis);
    padding-left: 16px;
    margin: 16px 0;
    color: var(--fgColor-muted);
}
.about-preview code {
    background: var(--bgColor-default);
    padding: 2px 6px;
    border-radius: var(--borderRadius-small);
    font-family: ui-monospace, monospace;
    font-size: 0.9em;
}
.about-preview pre {
    background: var(--bgColor-default);
    padding: 16px;
    border-radius: var(--borderRadius-medium);
    overflow-x: auto;
    margin: 16px 0;
    border: 1px solid var(--borderColor-default);
}
.about-preview pre code { background: none; padding: 0; }
</style>
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/components/simple-comment-editor.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/components/tiptap-editor.css') }}">
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/simple-tiptap-editor.js') }}"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const tiptapContainer = document.getElementById('tiptap-container');
    const contentTextarea = document.getElementById('page_content');
    const previewDiv = document.getElementById('content-preview');

    const tiptapEditor = new SimpleTiptapEditor(tiptapContainer, {
        placeholder: '开始编辑关于页面内容...',
        content: contentTextarea.value || ''
    });

    tiptapEditor.onContentChange = function(htmlContent) {
        if (htmlContent === undefined || htmlContent === null) {
            htmlContent = '';
        }
        contentTextarea.value = htmlContent;
        if (previewDiv) {
            if (htmlContent.trim()) {
                previewDiv.innerHTML = htmlContent;
            } else {
                previewDiv.innerHTML = '<p class="color-fg-muted m-0">输入内容后将在此处显示预览</p>';
            }
        }
    };

    document.getElementById('about-form').addEventListener('submit', function(e) {
        const pageTitle = document.getElementById('page_title').value.trim();
        const pageContent = contentTextarea.value.trim();
        if (!pageTitle || !pageContent) {
            e.preventDefault();
            alert('请填写页面标题和内容');
            return;
        }
    });
});
</script>
{% endblock %}
