{% extends "base.html" %}

{% block title %}管理后台 - 我的个人网站{% endblock %}

{% block content %}
<div class="text-center py-6 mb-6">
    <h1 class="f2 text-bold color-fg-default m-0 mb-2">管理后台</h1>
    <p class="f5 color-fg-muted m-0">欢迎回来，{{ current_user.username }}！</p>
</div>

<div class="d-grid gap-4 mb-8 grid-cols-1 grid-regular-cols-2 grid-large-cols-3">
    <!-- 文章管理 -->
    <div class="Box border rounded-2 overflow-hidden shadow-sm">
        <div class="Box-body p-4">
            <div class="d-flex items-start gap-3 mb-3">
                <div class="d-flex items-center justify-center color-bg-muted border rounded-2 flex-shrink-0" style="width: 40px; height: 40px;">
                    <i class="fas fa-blog color-fg-accent"></i>
                </div>
                <div class="flex-1 overflow-hidden">
                    <h2 class="f4 text-semibold color-fg-default m-0 mb-1">文章管理</h2>
                    <p class="f6 color-fg-muted m-0">管理博客文章和内容</p>
                </div>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <a href="{{ url_for('admin.new_post') }}" class="btn btn-primary btn-sm no-underline"><i class="fas fa-plus"></i> 新建</a>
                <a href="{{ url_for('admin.admin_posts') }}" class="btn btn-secondary btn-sm no-underline"><i class="fas fa-list"></i> 列表</a>
            </div>
        </div>
    </div>

    <!-- 友链管理 -->
    <div class="Box border rounded-2 overflow-hidden shadow-sm">
        <div class="Box-body p-4">
            <div class="d-flex items-start gap-3 mb-3">
                <div class="d-flex items-center justify-center color-bg-muted border rounded-2 flex-shrink-0" style="width: 40px; height: 40px;">
                    <i class="fas fa-link color-fg-success"></i>
                </div>
                <div class="flex-1 overflow-hidden">
                    <h2 class="f4 text-semibold color-fg-default m-0 mb-1">友链管理</h2>
                    <p class="f6 color-fg-muted m-0">管理友情链接申请和展示</p>
                </div>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <a href="{{ url_for('admin.new_link') }}" class="btn btn-primary btn-sm no-underline"><i class="fas fa-plus"></i> 新增</a>
                <a href="{{ url_for('admin.admin_links') }}" class="btn btn-secondary btn-sm no-underline"><i class="fas fa-list"></i> 列表</a>
            </div>
        </div>
    </div>

    <!-- 关于页面 -->
    <div class="Box border rounded-2 overflow-hidden shadow-sm">
        <div class="Box-body p-4">
            <div class="d-flex items-start gap-3 mb-3">
                <div class="d-flex items-center justify-center color-bg-muted border rounded-2 flex-shrink-0" style="width: 40px; height: 40px;">
                    <i class="fas fa-user-circle color-fg-default"></i>
                </div>
                <div class="flex-1 overflow-hidden">
                    <h2 class="f4 text-semibold color-fg-default m-0 mb-1">关于页面</h2>
                    <p class="f6 color-fg-muted m-0">管理个人介绍页面</p>
                </div>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <a href="{{ url_for('admin.admin_about') }}" class="btn btn-primary btn-sm no-underline"><i class="fas fa-cog"></i> 管理</a>
            </div>
        </div>
    </div>

    <!-- 版本管理 -->
    <div class="Box border rounded-2 overflow-hidden shadow-sm">
        <div class="Box-body p-4">
            <div class="d-flex items-start gap-3 mb-3">
                <div class="d-flex items-center justify-center color-bg-muted border rounded-2 flex-shrink-0" style="width: 40px; height: 40px;">
                    <i class="fas fa-code-branch color-fg-attention"></i>
                </div>
                <div class="flex-1 overflow-hidden">
                    <h2 class="f4 text-semibold color-fg-default m-0 mb-1">版本管理</h2>
                    <p class="f6 color-fg-muted m-0">管理项目版本信息</p>
                </div>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <a href="{{ url_for('version.admin_versions') }}" class="btn btn-primary btn-sm no-underline"><i class="fas fa-list"></i> 列表</a>
                <a href="{{ url_for('version.new_version') }}" class="btn btn-secondary btn-sm no-underline"><i class="fas fa-plus"></i> 新建</a>
            </div>
        </div>
    </div>

    <!-- 技能管理 -->
    <div class="Box border rounded-2 overflow-hidden shadow-sm">
        <div class="Box-body p-4">
            <div class="d-flex items-start gap-3 mb-3">
                <div class="d-flex items-center justify-center color-bg-muted border rounded-2 flex-shrink-0" style="width: 40px; height: 40px;">
                    <i class="fas fa-tools color-fg-danger"></i>
                </div>
                <div class="flex-1 overflow-hidden">
                    <h2 class="f4 text-semibold color-fg-default m-0 mb-1">技能管理</h2>
                    <p class="f6 color-fg-muted m-0">管理技能标签</p>
                </div>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <a href="{{ url_for('admin.admin_skills') }}" class="btn btn-primary btn-sm no-underline"><i class="fas fa-list"></i> 列表</a>
                <a href="{{ url_for('admin.new_skill') }}" class="btn btn-secondary btn-sm no-underline"><i class="fas fa-plus"></i> 新建</a>
            </div>
        </div>
    </div>

    <!-- 系统设置 -->
    <div class="Box border rounded-2 overflow-hidden shadow-sm">
        <div class="Box-body p-4">
            <div class="d-flex items-start gap-3 mb-3">
                <div class="d-flex items-center justify-center color-bg-muted border rounded-2 flex-shrink-0" style="width: 40px; height: 40px;">
                    <i class="fas fa-cog color-fg-muted"></i>
                </div>
                <div class="flex-1 overflow-hidden">
                    <h2 class="f4 text-semibold color-fg-default m-0 mb-1">系统设置</h2>
                    <p class="f6 color-fg-muted m-0">网站配置和管理</p>
                </div>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <a href="{{ url_for('settings.profile_settings') }}" class="btn btn-primary btn-sm no-underline"><i class="fas fa-user-edit"></i> 个人资料</a>
                <a href="{{ url_for('settings.security_settings') }}" class="btn btn-secondary btn-sm no-underline"><i class="fas fa-shield-alt"></i> 安全</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
