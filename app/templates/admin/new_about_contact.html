{% extends "base.html" %}

{% block title %}新建联系方式 - 管理后台{% endblock %}

{% block content %}
<div class="container-xl mx-auto px-3 py-4">
    <div class="d-flex flex-wrap items-center justify-between gap-3 mb-4">
        <h1 class="f3 text-bold color-fg-default m-0"><i class="fas fa-plus mr-2"></i>新建联系方式</h1>
        <a href="{{ url_for('admin.admin_about') }}" class="btn btn-outline btn-sm">
            <i class="fas fa-arrow-left"></i> 返回管理
        </a>
    </div>

    <div class="Box">
        <div class="Box-body p-4">
            <form method="POST" id="contact-form" class="d-flex flex-column gap-4">
                <div class="d-grid grid-cols-1" style="gap: 24px;">
                    <style>
                    @media (min-width: 768px) {
                        .contact-edit-grid { grid-template-columns: 1fr 1fr; }
                    }
                    </style>
                    <div class="d-grid contact-edit-grid" style="gap: 24px;">
                        <div class="d-flex flex-column gap-4">
                            <div class="d-flex flex-column gap-2">
                                <label for="platform" class="form-label m-0">平台名称 *</label>
                                <input type="text" class="form-control" id="platform" name="platform" required placeholder="例如: GitHub, LinkedIn, 微信">
                            </div>
                            <div class="d-flex flex-column gap-2">
                                <label for="icon" class="form-label m-0">图标类名 *</label>
                                <input type="text" class="form-control" id="icon" name="icon" required placeholder="例如: fab fa-github, fas fa-envelope">
                                <p class="f6 color-fg-muted m-0"><i class="fas fa-info-circle mr-1"></i>使用 Font Awesome 图标，如 <code class="text-mono">fab fa-github</code>、<code class="text-mono">fas fa-envelope</code></p>
                            </div>
                            <div class="d-flex flex-column gap-2">
                                <label for="text" class="form-label m-0">显示文本 *</label>
                                <input type="text" class="form-control" id="text" name="text" required placeholder="例如: GitHub, 邮箱地址">
                            </div>
                            <div class="d-flex flex-column gap-2">
                                <label for="url" class="form-label m-0">链接地址</label>
                                <input type="url" class="form-control" id="url" name="url" placeholder="例如: https://github.com/username">
                                <p class="f6 color-fg-muted m-0">可选，如果不填写则只显示文本</p>
                            </div>
                        </div>
                        <div class="d-flex flex-column gap-4">
                            <div class="d-flex flex-column gap-2">
                                <label for="color" class="form-label m-0">图标颜色</label>
                                <select class="form-select" id="color" name="color">
                                    <option value="primary">蓝色 (primary)</option>
                                    <option value="secondary">灰色 (secondary)</option>
                                    <option value="success">绿色 (success)</option>
                                    <option value="danger">红色 (danger)</option>
                                    <option value="warning">黄色 (warning)</option>
                                    <option value="info">青色 (info)</option>
                                    <option value="light">浅色 (light)</option>
                                    <option value="dark">深色 (dark)</option>
                                </select>
                            </div>
                            <div class="d-flex flex-column gap-2">
                                <label for="order" class="form-label m-0">显示顺序</label>
                                <input type="number" class="form-control" id="order" name="order" value="0" min="0" placeholder="数字越小越靠前">
                            </div>
                            <label class="d-flex items-center gap-2 f6 color-fg-default m-0">
                                <input type="checkbox" id="is_active" name="is_active" checked>
                                <span>显示此联系方式</span>
                            </label>
                            <div class="d-flex flex-column gap-2">
                                <label class="form-label m-0">预览效果</label>
                                <div class="border rounded-2 color-bg-muted p-3 f6">
                                    <div id="contact-preview">
                                        <i class="fas fa-envelope color-fg-accent"></i>
                                        <span class="color-fg-default ml-2">示例联系方式</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-flex flex-wrap justify-end gap-2 border-top pt-4">
                    <a href="{{ url_for('admin.admin_about') }}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> 取消
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> 保存联系方式
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
(function() {
    var COLOR_CLASS = {
        primary: 'color-fg-accent',
        secondary: 'color-fg-muted',
        success: 'color-fg-success',
        danger: 'color-fg-danger',
        warning: 'color-fg-attention',
        info: 'color-fg-accent',
        light: 'color-fg-subtle',
        dark: 'color-fg-default'
    };
    function contactColorClass(key) {
        return COLOR_CLASS[key] || 'color-fg-accent';
    }
    document.addEventListener('DOMContentLoaded', function() {
        var iconInput = document.getElementById('icon');
        var textInput = document.getElementById('text');
        var colorSelect = document.getElementById('color');
        var urlInput = document.getElementById('url');
        var previewDiv = document.getElementById('contact-preview');
        function updatePreview() {
            var icon = iconInput.value.trim() || 'fas fa-envelope';
            var text = textInput.value.trim() || '示例联系方式';
            var color = colorSelect.value;
            var url = urlInput.value.trim();
            var ccls = contactColorClass(color);
            var html = '<i class="' + icon + ' ' + ccls + '"></i>';
            if (url) {
                html += ' <a href="' + url + '" target="_blank" rel="noopener noreferrer" class="color-fg-accent no-underline ml-2">' + text + '</a>';
            } else {
                html += ' <span class="color-fg-default ml-2">' + text + '</span>';
            }
            previewDiv.innerHTML = html;
        }
        iconInput.addEventListener('input', updatePreview);
        textInput.addEventListener('input', updatePreview);
        colorSelect.addEventListener('change', updatePreview);
        urlInput.addEventListener('input', updatePreview);
        document.getElementById('contact-form').addEventListener('submit', function(e) {
            var platform = document.getElementById('platform').value.trim();
            var icon = document.getElementById('icon').value.trim();
            var text = document.getElementById('text').value.trim();
            if (!platform || !icon || !text) {
                e.preventDefault();
                alert('请填写所有必填字段');
            }
        });
    });
})();
</script>
{% endblock %}
