{% extends "base.html" %}

{% block title %}新建关于页面内容 - 管理后台{% endblock %}

{% block content %}
<div class="container-xl mx-auto px-3 py-4">
    <div class="d-flex flex-wrap items-center justify-between gap-3 mb-4">
        <h1 class="f3 text-bold color-fg-default m-0"><i class="fas fa-plus mr-2"></i>新建关于页面内容</h1>
        <a href="{{ url_for('admin.admin_about') }}" class="btn btn-outline btn-sm">
            <i class="fas fa-arrow-left"></i> 返回管理
        </a>
    </div>

    <div class="Box">
        <div class="Box-body p-4">
            <form method="POST" id="content-form" class="d-flex flex-column gap-4">
                <div class="d-flex flex-column gap-2">
                    <label class="form-label m-0">内容预览</label>
                    <div class="border rounded-2 color-bg-muted p-3 overflow-y-auto f6" style="min-height: 200px;">
                        <div id="content-preview">
                            <p class="color-fg-muted m-0">输入内容后将在此处显示预览</p>
                        </div>
                    </div>
                </div>

                <div class="d-flex flex-column gap-2">
                    <label for="content" class="form-label m-0">内容 *</label>
                    <div id="tiptap-container"></div>
                    <textarea id="content" name="content" class="d-none" required></textarea>
                    <p class="f6 color-fg-muted m-0"><i class="fas fa-info-circle mr-1"></i>使用富文本编辑器，支持格式化文本、链接、图片等</p>
                </div>

                <div class="d-flex flex-wrap justify-end gap-2">
                    <a href="{{ url_for('admin.admin_about') }}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> 取消
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> 保存内容
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ asset_url('css/components/simple-comment-editor.css') }}">
<link rel="stylesheet" href="{{ asset_url('css/components/tiptap-editor.css') }}">
{% endblock %}

{% block extra_js %}
<script src="{{ asset_url('js/simple-tiptap-editor.js') }}"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const tiptapContainer = document.getElementById('tiptap-container');
    const contentTextarea = document.getElementById('content');
    const previewDiv = document.getElementById('content-preview');

    const tiptapEditor = new SimpleTiptapEditor(tiptapContainer, {
        placeholder: '开始编辑内容...',
        content: ''
    });

    tiptapEditor.onContentChange = function(htmlContent) {
        if (htmlContent === undefined || htmlContent === null) {
            htmlContent = '';
        }
        contentTextarea.value = htmlContent;
        if (previewDiv) {
            if (htmlContent.trim()) {
                previewDiv.innerHTML = htmlContent;
            } else {
                previewDiv.innerHTML = '<p class="color-fg-muted m-0">输入内容后将在此处显示预览</p>';
            }
        }
    };

    document.getElementById('content-form').addEventListener('submit', function(e) {
        const content = contentTextarea.value.trim();
        if (!content) {
            e.preventDefault();
            alert('请填写内容');
            return;
        }
    });
});
</script>
{% endblock %}
