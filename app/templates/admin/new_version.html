{% extends "base.html" %}

{% block title %}新建版本 - 管理后台{% endblock %}

{% block content %}
<div class="container-lg mx-auto px-3 py-4">
    <div class="Box" style="max-width: 720px; margin-left: auto; margin-right: auto;">
        <div class="Box-header border-bottom">
            <h2 class="f3 text-bold m-0"><i class="fas fa-plus mr-2"></i>新建版本</h2>
        </div>
        <div class="Box-body p-4">
            {% if error %}
            <div class="flash flash-danger mb-4">{{ error }}</div>
            {% endif %}

            <form id="versionForm" class="d-flex flex-column gap-4">
                <div class="d-flex flex-column gap-2">
                    <label for="version_number" class="form-label m-0">版本号 <span class="color-fg-danger">*</span></label>
                    <input type="text" class="form-control" id="version_number" name="version_number"
                           placeholder="例如: v1.0.0" required>
                    <p class="f6 color-fg-muted m-0">版本号格式建议使用语义化版本，如 v1.0.0</p>
                </div>

                <div class="d-flex flex-column gap-2">
                    <label for="title" class="form-label m-0">版本标题 <span class="color-fg-danger">*</span></label>
                    <input type="text" class="form-control" id="title" name="title"
                           placeholder="例如: 重大功能更新" required>
                </div>

                <div class="d-flex flex-column gap-2">
                    <label for="release_date" class="form-label m-0">发布日期</label>
                    <input type="date" class="form-control" id="release_date" name="release_date">
                    <p class="f6 color-fg-muted m-0">留空则使用当前日期</p>
                </div>

                <div class="d-flex flex-column gap-2">
                    <label for="description" class="form-label m-0">版本描述 <span class="color-fg-danger">*</span></label>
                    <textarea class="form-control" id="description" name="description" rows="8"
                              placeholder="详细描述本次版本更新的内容..." required></textarea>
                    <p class="f6 color-fg-muted m-0">支持 Markdown 格式</p>
                </div>

                <div class="d-flex flex-wrap justify-between gap-2">
                    <a href="{{ url_for('version.admin_versions') }}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> 返回列表
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> 创建版本
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function showMessage(message, type) {
    const el = document.createElement('div');
    el.className = type === 'success' ? 'flash flash-success' : 'flash flash-danger';
    el.style.cssText = 'position: fixed; top: 20px; right: 20px; z-index: 9999; max-width: 320px; padding: 12px 16px;';
    el.textContent = message;
    document.body.appendChild(el);
    setTimeout(() => { if (el.parentNode) el.remove(); }, 3000);
}

document.getElementById('versionForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const formData = {
        version_number: document.getElementById('version_number').value,
        title: document.getElementById('title').value,
        description: document.getElementById('description').value,
        release_date: document.getElementById('release_date').value
    };
    fetch('{{ url_for("version.new_version") }}', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-Requested-With': 'XMLHttpRequest'
        },
        body: JSON.stringify(formData)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            showMessage(data.message, 'success');
            setTimeout(() => { window.location.href = '{{ url_for("version.admin_versions") }}'; }, 1000);
        } else {
            showMessage(data.message, 'error');
        }
    })
    .catch(() => {
        showMessage('创建失败，请稍后重试', 'error');
    });
});
</script>
{% endblock %}
