{% extends "base.html" %}

{% block title %}{{ page_title or '关于我' }} - 我的个人网站{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
    {% if page_content %}
    <div class="Box overflow">
        <div class="Box-body p-6 about-content-display">
            {{ page_content | safe }}
        </div>
    </div>
    <div class="Box">
        <div class="Box-body p-8 text-center">
            <div class="mb-4">
                <i class="fas fa-edit f00 color-fg-subtle"></i>
            </div>
            <h3 class="f2 text-bold color-fg-muted mb-2">补充中...</h3>
            <p class="f4 color-fg-subtle m-0">内容正在完善中，敬请期待</p>
        </div>
    </div>
    {% endif %}
</div>
{% endblock %}

{% block extra_css %}
<style>
/* 关于页面富文本 — Primer light tokens */
.about-content-display {
    font-size: 16px;
    line-height: 1.6;
    color: var(--fgColor-default);
}

.about-content-display h1 {
    font-size: 2rem;
    font-weight: 600;
    line-height: 1.25;
    margin: 0 0 1.5rem 0;
    color: var(--fgColor-default);
    text-align: center;
}

.about-content-display h2 {
    font-size: 1.5rem;
    font-weight: 600;
    line-height: 1.3;
    margin: 1.5rem 0 0.75rem 0;
    color: var(--fgColor-default);
    border-bottom: 1px solid var(--borderColor-default);
    padding-bottom: 0.5rem;
}

.about-content-display h3 {
    font-size: 1.25rem;
    font-weight: 600;
    margin: 1.25rem 0 0.5rem 0;
    color: var(--fgColor-default);
}

.about-content-display h4 {
    font-size: 1.125rem;
    font-weight: 600;
    margin: 1rem 0 0.5rem 0;
    color: var(--fgColor-default);
}

.about-content-display h5,
.about-content-display h6 {
    font-size: 1rem;
    font-weight: 600;
    margin: 0.75rem 0 0.25rem 0;
    color: var(--fgColor-muted);
}

.about-content-display p {
    margin: 0 0 1rem 0;
    line-height: 1.7;
    color: var(--fgColor-default);
}

.about-content-display p:last-child {
    margin-bottom: 0;
}

.about-content-display strong {
    font-weight: 600;
    color: var(--fgColor-default);
}

.about-content-display em {
    font-style: italic;
    color: var(--fgColor-default);
}

.about-content-display u {
    text-decoration: underline;
    text-decoration-color: var(--fgColor-accent);
}

.about-content-display a {
    color: var(--fgColor-accent);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
}

.about-content-display a:hover {
    color: var(--fgColor-accent);
    border-bottom-color: var(--borderColor-accent-emphasis);
}

.about-content-display ul,
.about-content-display ol {
    margin: 1rem 0;
    padding-left: 1.5rem;
    color: var(--fgColor-default);
}

.about-content-display li {
    margin: 0.375rem 0;
    line-height: 1.6;
}

.about-content-display ul li { list-style-type: disc; }
.about-content-display ol li { list-style-type: decimal; }

.about-content-display blockquote {
    border-left: 4px solid var(--borderColor-accent-emphasis);
    background: var(--bgColor-muted);
    margin: 1.25rem 0;
    padding: 1rem 1.25rem;
    border-radius: 0 var(--borderRadius-medium) var(--borderRadius-medium) 0;
    font-style: italic;
    color: var(--fgColor-muted);
}

.about-content-display code {
    background: var(--bgColor-muted);
    color: var(--fgColor-default);
    padding: 0.125rem 0.375rem;
    border-radius: var(--borderRadius-small);
    font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 0.875em;
    border: 1px solid var(--borderColor-default);
}

.about-content-display pre {
    background: var(--bgColor-muted);
    border: 1px solid var(--borderColor-default);
    border-radius: var(--borderRadius-medium);
    padding: 1rem;
    margin: 1.25rem 0;
    overflow-x: auto;
    font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 0.875rem;
    line-height: 1.6;
}

.about-content-display pre code {
    background: none;
    border: none;
    padding: 0;
    font-size: inherit;
}

.about-content-display hr {
    border: none;
    border-top: 1px solid var(--borderColor-default);
    margin: 1.5rem 0;
}

.about-content-display table {
    border-collapse: collapse;
    width: 100%;
    margin: 1.25rem 0;
    border: 1px solid var(--borderColor-default);
    border-radius: var(--borderRadius-medium);
    overflow: hidden;
    background: var(--bgColor-default);
}

.about-content-display th,
.about-content-display td {
    border: 1px solid var(--borderColor-default);
    padding: 0.5rem 0.75rem;
    text-align: left;
    color: var(--fgColor-default);
}

.about-content-display th {
    background: var(--bgColor-muted);
    font-weight: 600;
}

.about-content-display tr:nth-child(even) {
    background: var(--bgColor-muted);
}

.about-content-display tr:hover {
    background: var(--bgColor-inset);
}

.about-content-display img {
    max-width: 100%;
    height: auto;
    border-radius: var(--borderRadius-medium);
    margin: 0.75rem 0;
    border: 1px solid var(--borderColor-default);
}

.about-content-display mark {
    background: var(--bgColor-attention-muted);
    color: var(--fgColor-attention);
    padding: 0.125rem 0.25rem;
    border-radius: var(--borderRadius-small);
}

@media (max-width: 767px) {
    .about-content-display h1 { font-size: 1.75rem; }
    .about-content-display h2 { font-size: 1.25rem; }
}
</style>
{% endblock %}
